# Все слова клиента Hammerhall (ревью CLI №1, СР-14).
#
# Подстановки — как в String.format, Locale.ROOT; знак процента — %%.
# Пробелы в начале значения и после переноса строки файл свойств съедает:
# отступ — \u0020. Пробел в конце значения файл хранит, но редакторы
# и git его срезают и ругают — поэтому и он записан как \u0020.
# Ключи сверяет MsgTest: нет ключа — тест красный, лишний — тоже.

# ---------- общее ----------

main.usage = Hammerhall — клиент кузницы\n\
\n\
\u0020 hammerhall login              войти по почте и паролю\n\
\u0020 hammerhall login --token      вставить ключ из личного кабинета\n\
\u0020 hammerhall pull <задача>      забрать задачу в свой проект\n\
\u0020                               (--force — перезаписать; прежний файл отложится в .bak)\n\
\u0020 hammerhall submit <файл>      отправить решение на проверку\n\
\u0020 hammerhall profile [кузница]  профиль по осям; вне кузницы — список кузниц\n\
\u0020 hammerhall logout             удалить ключ с этой машины\n\
\u0020 hammerhall version            версия клиента\n\
\n\
Флаги везде: --no-color, --verbose, --help, --api <адрес> (свой стенд).\n\
\n\
Почта и пароль — те же, что на сайте hammerhall.io. Ключ клиент получает\n\
и хранит сам, в ~/.hammerhall/credentials: один вход — на все кузницы.\n\
\n\
Коды возврата: 0 — готово (решение зачтено), 1 — решение не зачтено,\n\
2 — ошибка (вызов, файл, отказ платформы), 3 — платформа недоступна.\n
main.unknown = Неизвестная команда: %s
main.unexpected = Непредвиденная ошибка: %s
version.details = java %s · %s · платформа %s
input.unreadable = Не удалось прочитать ввод

args.value.missing = Флагу %1$s нужно значение: %1$s <адрес>
args.value.unexpected = Флаг %s не принимает значения
args.flag.unknown = Команда %2$s не знает флага %1$s. Справка: hammerhall help
args.missing = Не хватает аргумента. Верно так:\n\
\u0020   %s
args.extra = Лишнее в командной строке: %s\n\
Верно так:\n\
\u0020   %s

ids.forge.bad = Это не похоже на идентификатор кузницы: %s
ids.task.bad = Это не похоже на номер задачи: %s

time.seconds = %d с
time.minutes = %d мин
time.hours = %d ч
time.hours.minutes = %d ч %d мин
time.days = %d сут
time.days.hours = %d сут %d ч

# ---------- адрес платформы (БЛОК-3) ----------

platform.bad = Неверный адрес платформы: %s (нужно https://хост, без запроса и фрагмента)
platform.http = Адрес %s — без шифрования. http:// допустим только для своей машины (localhost, 127.0.0.1, ::1).
platform.overridden = Адрес платформы переопределён: %s
platform.legacy.ignored = Строка api=%s в .hammerhall/config кузницы больше не действует:\n\
\u0020 адрес из файла в репозитории — путь утечки пароля. Свой стенд — HAMMERHALL_API или --api.

# ---------- кузница ----------

forge.notfound = Это не похоже на кузницу: не найден .hammerhall/forge\n\
(или корень репозитория с pom.xml и src/main/java).\n\
Запустите команду внутри клонированного репозитория кузницы.
forge.guessed = Нет файла .hammerhall/forge — кузница определена по имени каталога: %s.\n\
\u0020 Если каталог переименован при клонировании, решения уйдут не в ту кузницу.
forge.name.bad = Каталог «%s» не годится как имя кузницы, а файла .hammerhall/forge нет.\n\
Запустите команду в клоне кузницы.
forge.marker.empty = Пустой %s — непонятно, какая это кузница.
forge.marker.unreadable = Не читается %s

# ---------- ключи (АРХ-3, БЛОК-4) ----------

credentials.header = # Ключи доступа клиента Hammerhall — по адресу платформы.\n\
# Это секрет: не копируйте файл и не показывайте его. Выйти — hammerhall logout.\n
credentials.none = Вход не выполнен. Выполните:\n\
\u0020   hammerhall login
credentials.none.stand = Вход на %s не выполнен. Выполните с тем же адресом:\n\
\u0020   hammerhall login
credentials.read = Файл ключей не читается: %s
credentials.write = Не удалось сохранить ключ: %s
credentials.migrate.moved = Ключ перенесён из кузницы в %s: теперь один вход на все кузницы этой машины.
credentials.migrate.dropped = Старый ключ из кузницы удалён (%s): вход на этой машине уже выполнен.
credentials.migrate.leftover = Не удалось убрать ключ из кузницы: %s.\n\
\u0020 Удалите файл сами — ключу в рабочем дереве git не место.
credentials.migrate.badapi = В %s лежит ключ с непонятным адресом платформы — клиент его не переносит.\n\
\u0020 Удалите файл и войдите заново: hammerhall login

# ---------- разговор с платформой ----------

api.down = Платформа недоступна: %s
api.noanswer = Платформа не отвечает: %s
api.timeout = Платформа не ответила за %d с.
api.broken = Сбой связи: %s
api.interrupted = Прервано
api.notjson = Платформа ответила %d, но не JSON. Проверьте адрес платформы и прокси.
api.retry.auto = Платформа занята — повторю через %s… (Ctrl-C — прервать)
api.redirect = Платформа ответила перенаправлением (%d → %s).\n\
API так не отвечает: проверьте адрес платформы и прокси. Ключ за перенаправлением не отправлен.
api.bad = Платформа отклонила запрос: %s
api.unauthorized = Ключ не принят. Возможно, он отозван сменой пароля или устарел.\n\
Выполните: hammerhall login
api.forbidden = Доступ закрыт: %s
api.notfound = Не найдено: %s
api.notfound.path = Не найдено: %s\n\
Проверьте, та ли кузница в .hammerhall/forge и есть ли доступ к задаче.
api.toolarge = Файл слишком большой для проверки
api.outdated = Клиент устарел (у вас %s), платформа его больше не принимает: %s\n\
Обновите кузницу — подтяните изменения основного репозитория, и обёртка скачает новый клиент.
api.outdated.soft = Клиент устарел: у вас %s, платформа ждёт %s или новее.\n\
\u0020 Обновите кузницу — подтяните изменения основного репозитория, и обёртка скачает новый клиент.
api.toomany = Слишком часто. Подождите немного.
api.toomany.in = Слишком часто. Повторите через %s.
api.busy = Платформа временно недоступна. Повторите чуть позже.
api.busy.in = Платформа занята проверками. Повторите через %s.
api.gateway = Платформа не ответила (%d): сбой между вами и ней. Повторите чуть позже.
api.status = Платформа ответила %d: %s
api.noexplanation = (без объяснения)

# ---------- login, logout ----------

login.intro = Вход по той же почте и паролю, что и на сайте hammerhall.io.
login.email = Почта:\u0020
login.password = Пароль:\u0020
login.email.empty = Почта не введена
login.password.empty = Пароль не введён
login.visible = Ввод НЕ скрывается: это не терминал (IDE или конвейер) — набранное будет видно.
login.token.hint = Ключ выпускается в личном кабинете на hammerhall.io.
login.token.prompt = Ключ:\u0020
login.token.empty = Пустой ключ
login.token.bad = Ключ выглядит неправильно: в нём есть символы, которых в ключе не бывает.\n\
Ключ платформы — строка из латинских букв и цифр.\n\
Скорее всего скопировалось лишнее — попробуйте ещё раз.
login.arg.rejected = Ключ аргументом не принимается: он остался бы в истории\n\
терминала и был бы виден в списке процессов.\n\
\n\
\u0020   hammerhall login            вход по почте и паролю\n\
\u0020   hammerhall login --token    вставить ключ из кабинета
login.nokey = Платформа ответила успехом, но ключа в ответе нет.\n\
Похоже, клиент устарел — обновите кузницу и попробуйте снова.
login.badkey = Платформа вернула ключ в неожиданном виде — обновите кузницу.
login.401 = Не подошли почта или пароль.\n\
\n\
Платформа намеренно не уточняет, что именно не подошло:\n\
иначе по ответу можно было бы узнать, кто зарегистрирован.\n\
Пароль забыт — «Забыли пароль?» на hammerhall.io.
login.403 = Почта не подтверждена.\n\
\n\
Откройте ссылку из письма, пришедшего при регистрации,\n\
и повторите. Письмо не пришло или потерялось — запросите\n\
новое на hammerhall.io.
login.saved = Ключ получен и сохранён
login.verify.rejected = Ключ сохранён, но платформа его пока не приняла.\n\
\u0020 Если следующая команда откажет — повторите вход: hammerhall login
login.verify.failed = Проверить ключ сейчас не удалось: %s\n\
\u0020 Ключ сохранён. Если следующая команда откажет — повторите вход.

logout.done = Ключ удалён с этой машины
logout.note = \u0020 На платформе он остаётся действующим. Отозвать все ключи разом — сменить пароль на hammerhall.io.
logout.none = Вход на этой машине и так не выполнен.

# ---------- pull ----------

pull.taking = Забираю %s…
pull.nosource = Текст задачи %s ещё не выложен на платформу. Это не ваша ошибка — попробуйте позже.
pull.package.bad = Испорченный пакет в тексте задачи: %s
pull.exists = Файл уже есть: %s\n\
Ваше решение не тронуто. Перезаписать текстом задачи (прежний файл отложится рядом, .bak):\n\
\u0020   hammerhall pull %s --force
pull.backup = Прежний файл отложен: %s
pull.stage = ступень %s
pull.axis = ведущая ось %s
pull.next = Решайте и отправляйте:\n\
\u0020 hammerhall submit %s.java

# ---------- submit (БЛОК-1, БЛОК-5, ВЫС-4…10, СР-8) ----------

submit.sending = Отправляю %s…
submit.queued = В очереди на проверку…
submit.running = Проверяется…
submit.queued.noid = Платформа приняла решение в очередь, но не назвала номер — обновите кузницу.
submit.slow = Проверка идёт дольше обычного. Решение не потеряно — платформа его считает.\n\
Повторите ту же отправку через минуту: вердикт придёт из истории.
submit.passed = PASSED — %d/%d тестов, %d мс
submit.failed = FAILED — прошло %d из %d тестов
submit.failures = Не прошли:
submit.style = STYLE_VIOLATION — решение не в стрим-стиле
submit.compile = COMPILE_ERROR — не компилируется
submit.timeout = TIMEOUT — слишком долго, проверка прервана
submit.resource = RESOURCE_LIMIT — решение не уложилось в память или в число процессов и было остановлено
submit.crashed = CRASHED — проверка сорвалась на нашей стороне, это не ваша ошибка. Повторите отправку.
submit.invalid = INVALID_INPUT — решение отклонено до запуска
submit.nostatus = Платформа не назвала вердикт — ответ неполный. Повторите отправку; не поможет — обновите кузницу.
submit.unknown = Вердикт %s — клиент такого не знает. Возможно, он устарел: обновите кузницу.
submit.history = \u0020 (этот код уже проверялся — вердикт из истории)
submit.nosources = Нет каталога src/main/java — это точно кузница?
submit.notfound = Файл не найден: %s
submit.ambiguous = Файлов с таким именем несколько:%s\n\
Укажите путь целиком.
submit.outside = Файл вне кузницы: %s\n\
Отправлять можно только решения из этого репозитория.
submit.toobig = Файл больше %d КБ — похоже, это не решение.
submit.unreadable = Не удалось прочитать файл %s: %s
submit.encoding = Файл %s не в UTF-8. Сохраните его в UTF-8 и повторите:\n\
в IDEA — File > File Encoding > UTF-8 > Convert.

# ---------- profile (СР-1, СР-3) ----------

profile.forge = Кузница: %s
profile.totals = Решено задач: %d   Очков: %d
profile.axis = \u0020 %-5s %s  %4.1f   потолок %d, фундамент %s%%
profile.empty = Профиль пуст — решите первую задачу.
profile.empty.code = Засчитанные задачи не несут осей — вектор пока пуст.
profile.forges.title = Кузницы:
profile.forges.row = \u0020 %-16s %-28s решено %3d, отправок %d
profile.forges.none = Кузниц пока нет.
profile.forges.hint = Профиль по осям — в клоне кузницы или: hammerhall profile <кузница>
